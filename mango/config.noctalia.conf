# ~/.config/mango/config.conf
# Minimal mango config: 2560x1600 @ 1.25 scale, ghostty terminal, DMS shell.
# Verify your actual output name first with: wlr-randr
# (swap eDP-1 below if yours differs, e.g. DP-1, HDMI-A-1, etc.)

# ---------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------
# key:value format — width/height/refresh should match a mode wlr-randr lists
# for your panel. Adjust `refresh` if it's not 60Hz.
monitorrule=name:eDP-1,width:2560,height:1600,refresh:165,x:0,y:0,scale:1.25,vrr:0,rr:0

# Fractional scaling note: if you run XWayland apps, avoid relying on the
# compositor's global scale for those — it causes blurriness. Uncomment
# xwayland-satellite below if you hit that, and set QT/GTK scale envs instead.
# env=DISPLAY,:2
# exec-once=xwayland-satellite :2

# ---------------------------------------------------------------------------
# Blur
# ---------------------------------------------------------------------------
# blur=1  
# blur_layer=2  
# blur_optimized=0  
# blur_params_num_passes=3  
# blur_params_radius=5  
# blur_params_noise=0.02  
# blur_params_brightness=0.9  
# blur_params_contrast=0.9  
# blur_params_saturation=1.0

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env=XCURSOR_SIZE,24
env=XCURSOR_THEME,Adwaita
env=QT_QPA_PLATFORM,wayland
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=MOZ_ENABLE_WAYLAND,1

# ---------------------------------------------------------------------------
# Set cursor size and theme
# ---------------------------------------------------------------------------
cursor_size=24
cursor_theme=Adwaita

# ---------------------------------------------------------------------------
# Autostart (runs once on mango's first launch, not on config reload)
# ---------------------------------------------------------------------------
exec-once=noctalia
exec-once=udiskie --tray
exec-once=flatpak run org.signal.Signal --start-in-tray
# exec-once=/run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once=wl-paste --watch cliphist store

# ---------------------------------------------------------------------------
# Window gaps/border theming
# ---------------------------------------------------------------------------
# Border gaps
borderpx=3
gappih=4
gappiv=4
gappoh=4
gappov=4

# Border radius
border_radius=8

# Border colors (0xRRGGBBAA)
focuscolor=0xdededeff
bordercolor=0x222222ff

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
# Tag animation direction
tag_animation_direction=0

# ---------------------------------------------------------------------------
# Trackpad
# ---------------------------------------------------------------------------
# Natural scrolling
trackpad_natural_scrolling=1

# ---------------------------------------------------------------------------
# Core keybinds
# ---------------------------------------------------------------------------
bind=SUPER,t,spawn,kitty
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,quit,
bind=SUPER,r,reload_config,

binds=NONE,KP_End,killclient,

# App launcher via DMS (spotlight); swap for fuzzel/rofi if you prefer
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher

# Open DMS clipboard
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard

# Open DMS power menu
bind=SUPER,p,spawn,noctalia msg panel-toggle session

# Noctalia control center
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center

# Screenshot (grim + slurp)
bind=SUPER,p,spawn,grim -g "$(slurp)" - | wl-copy

# ---------------------------------------------------------------------------
# Window / layout management
# ---------------------------------------------------------------------------
bind=SUPER,f,togglemaximizescreen,
bind=NONE,KP_Begin,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
# bind=SUPER,space,togglefloating,
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
# bind=SUPER,Right,focusstack,next
# bind=SUPER,Left,focusstack,prev
bind=SUPER,Return,zoom
binds=NONE,KP_Home,zoom
bind=SUPER,O,toggleoverview,

# Resize master area
bind=SUPER,l,setmfact,+0.05
bind=SUPER,h,setmfact,-0.05

# Scroll through tiling arrangements
circle_layout=fair,dwindle,tile,center_tile,scroller
bind=SUPER,period,switch_layout
#bind=NONE,KP_Begin,switch_layout,

# Default master stack configuration
new_is_master=0
default_mfact=0.55
smartgaps=0

# Default scroll configuration
scroller_default_proportion=0.5
scroller_proportion_preset=0.25,0.50,0.75,1.00
bind=SUPER,e,switch_proportion_preset
bind=ALT,e,set_proportion,1.0

# Default overview configuration
ov_tab_mode=0 # 1 = Alt + Tab like non persistent behavior

# ---------------------------------------------------------------------------
# Tags / workspaces (1-9)
# ---------------------------------------------------------------------------
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,Right,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
binds=SUPER+CTRL,Down,viewtoright,
binds=SUPER+CTRL,Up,viewtoleft,
# Use s flag (binds) for keysim matching instead of physical keycode matching, allowing numlocked vs numunclocked keypad strokes to be interpreted differently
binds=NONE,KP_Next,viewtoright,
binds=NONE,KP_Prior,viewtoleft,
binds=NONE,KP_Left,focusstack,prev
binds=NONE,KP_Right,focusstack,next

# Swap adjacent windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Move window to adjacent workspace
bind=SUPER+CTRL+SHIFT,Up,tagtoleft,0
bind=SUPER+CTRL+SHIFT,Down,tagtoright,0

# ---------------------------------------------------------------------------
# Media / brightness keys
# ---------------------------------------------------------------------------
# Native audio controls
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=SHIFT,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=SHIFT,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Media keys — requires playerctl (works with most mpris players: Spotify, mpv, browsers, etc.)
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# ---------------------------------------------------------------------------
# Gestures
# ---------------------------------------------------------------------------
gesturebind=none,down,4,viewtoright
gesturebind=none,up,4,viewtoleft
gesturebind=none,right,4,toggleoverview
# gesturebind=none,down,4,toggleoverview

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down

# ---------------------------------------------------------------------------
# Mango effects
# ---------------------------------------------------------------------------
blur=1
blur_optimized=1
blur_layer=1 # Deactivated because DMS drop down widgest flash with blur layer when drawn over other apps
blur_params_num_passes=2
blur_params_radius=1

source=~/.config/mango/noctalia.conf
