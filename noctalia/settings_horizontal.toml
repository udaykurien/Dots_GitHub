config_version = 14

[audio]
enable_overdrive = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_opacity = 0.0
    capsule_padding = 8.0
    capsule_radius = 8
    capsule_thickness = 0.61999998986721039
    center = [ "cpu", "temp", "ram", "swap", "control-center", "disk", "battery", "network_rx", "network_tx", "widget" ]
    end = [ "notifications", "privacy", "tray", "bar_2", "group:g1", "group:g4", "session" ]
    font_family = "IBM Plex Sans Text"
    margin_ends = 0
    padding = 8
    radius = 0
    scale = 0.90000000596046448
    shadow = false
    start = [ "launcher", "clock", "weather", "media", "toggle", "workspaces", "btn" ]
    thickness = 38

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [
            "status",
            "textspace",
            "brightness",
            "textspace",
            "input_volume",
            "textspace",
            "volume",
            "textspace",
            "bluetooth",
            "textspace",
            "network"
        ]
        opacity = 0.0
        padding = 8.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "widget_2", "textspace", "notes", "textspace", "caffeine" ]
        opacity = 0.0
        padding = 8.0
        radius = 8.0

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "system"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821
cross_axis_padding = 4
enabled = true
icon_size = 28
inactive_opacity = 0.99999997764825821
main_axis_padding = 8
pinned = [
    "com.mitchellh.ghostty",
    "org.gnome.Nautilus",
    "firefox",
    "librewolf",
    "dev.zed.Zed",
    "org.gnome.Resources",
    "steam",
    "de.haeckerfelix.Shortwave",
    "com.stremio.Stremio",
    "org.signal.Signal",
    "re.fossplant.songrec",
    "com.github.wwmm.easyeffects",
    "org.wireshark.Wireshark",
    "dev.noctalia.Noctalia"
]
radius = 0
radius_bottom_left = 8
radius_bottom_right = 8
radius_top_left = 8
radius_top_right = 8
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "toronto, canada"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 336.0
    cx = 1024.0
    cy = 787.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1024.0
    cy = 640.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 560.0
    box_width = 640.0
    cx = 1018.0
    cy = 290.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        visualization_mode = "all"

