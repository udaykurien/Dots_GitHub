[widget.audio_visualizer]
bands = 32
color_1 = "on_surface"
color_2 = "on_surface"
enabled = false
interactive = false
show_when_idle = true
width = 48

[widget.bar_2]
type = "noctalia/world_clock:bar"

[widget.brightness]
show_label = false

    [widget.brightness.actions]
    scroll_down = "brightness-down 1"
    scroll_up = "brightness-up 1"

[widget.btn]
show_text = true
type = "ezequiel/mango_layouts:btn"

[widget.clock]
format = "{:%H:%M}  •  {:%a}, {:%d}"

[widget.control-center]
anchor = true
color = "on_surface_variant"
glyph = "badges-filled"

[widget.cpu]
visualization = "none"

[widget.disk]
visualization = "none"

[widget.input_volume]
color = "error"
mute_color = "on_surface"
show_label = false

    [widget.input_volume.actions]
    scroll_down = "mic-volume-down 1"
    scroll_up = "mic-volume-up 1"

[widget.launcher]
enabled = false
glyph = "menu-2"

[widget.media]
artist_first = true
max_length = 118
min_length = 118
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.network_rx]
network_speed_compact = true
visualization = "none"

[widget.network_tx]
network_speed_compact = true
visualization = "none"

[widget.notes]
type = "noctalia/notes:notes"

[widget.privacy]
active_color = "error"
hide_inactive = true

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.session]
enabled = false

[widget.status]
type = "aristides/udiskie:status"

[widget.swap]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.toggle]
