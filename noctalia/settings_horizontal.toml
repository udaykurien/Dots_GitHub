type = "maddingo/hypr-layout-switcher:toggle"

[widget.tray]
match_adjacent_spacing = true

[widget.volume]
show_label = false

    [widget.volume.actions]
    scroll_down = "volume-down 1"
    scroll_up = "volume-up 1"

[widget.weather]
show_condition = false

[widget.widget]
type = "piero-93/thinkpad-fan:widget"

[widget.widget_2]
type = "alexander/screen-toolkit:widget"

