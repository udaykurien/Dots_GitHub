network_speed_unit = "mb"
visualization = "none"

[widget.network_tx]
network_speed_compact = true
network_speed_unit = "mb"
visualization = "none"

[widget.privacy]
active_color = "error"
hide_inactive = true
icon_spacing = 18

[widget.ram]
glyph = "cpu-2"
stat = "ram_pct"
visualization = "none"

[widget.session]
enabled = false

[widget.status]
type = "aristides/udiskie:status"

[widget.swap]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.toggle]
enabled = false
type = "maddingo/hypr-layout-switcher:toggle"

[widget.tray]
colorize_icons = true
match_adjacent_spacing = true

[widget.volume]
show_label = false

    [widget.volume.actions]
    scroll_down = "volume-down 1"
    scroll_up = "volume-up 1"

[widget.weather]
show_condition = false

[widget.widget_2]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
active_pill_size = 1.9000000000000001
empty_color = "on_surface"
focused_output_only = true
occupied_color = "primary"
scroll_repeat = "steps"
style = "focus_hint"