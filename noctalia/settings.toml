config_version = 7

[audio]
enable_sounds = true

[bar.default]
capsule = true
capsule_opacity = 0.84999998100101948
capsule_padding = 8.0
capsule_radius = 10
capsule_thickness = 0.65999998897314072
center = [ "cpu", "temp", "group:g2", "control-center", "disk", "battery", "group:g3" ]
end = [
    "tray",
    "notifications",
    "widget",
    "notes",
    "clipboard",
    "caffeine",
    "brightness",
    "bluetooth",
    "network",
    "volume",
    "input_volume"
]
margin_ends = 0
padding = 4
radius = 0
radius_bottom_left = 8
radius_bottom_right = 8
scale = 0.90000000596046448
shadow = false
start = [ "privacy", "clock", "weather", "bar", "group:g1", "workspaces" ]
thickness = 44

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "media", "audio_visualizer", "cat_2" ]
    opacity = 0.84999996423721313
    padding = 8.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "ram", "swap" ]
    opacity = 0.84999996423721313
    padding = 8.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network_rx", "network_tx" ]
    opacity = 0.84999996423721313
    padding = 8.0

[battery]
warning_threshold = 25

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

[dock]
auto_hide = true
border_width = 3.5
concave_edge_corners = false
icon_size = 30
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "whitby, canada"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000002",
    "lockscreen-login-box@WL-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 640.0
    cy = 601.0
    output = "WL-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 103.0
    box_width = 400.0
    cx = 1024.0
    cy = 747.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1024.0
    cy = 640.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 512.0
    box_width = 512.0
    cx = 1024.0
    cy = 256.0
    output = "eDP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        bar_width = 0.59999999999999998
        bloom_intensity = 0.5
        fade_when_idle = true
        inner_diameter = 0.69999999999999996
        primary_color = "primary"
        ring_opacity = 0.80000000000000004
        rotation_speed = 0.5
        secondary_color = "secondary"
        sensitivity = 1.5
        visualization_mode = "bars_rings"
        wave_thickness = 1.0

[nightlight]
enabled = true
temperature_night = 5000

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/timer", "noctalia/notes", "oldirtty/color_picker", "noctalia/wallhaven" ]

[shell]
avatar_path = "/run/current-system/sw/share/pixmaps/faces/cat.jpg"
external_ip_enabled = true
font_family = "IBM Plex Sans Text"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    session_search = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Ayu"
community_palette = "Neon Surf"
custom_palette = "mass-effect-ketevstudio-wallhaven-3lxde3-rb"
mode = "dark"
source = "wallpaper"
