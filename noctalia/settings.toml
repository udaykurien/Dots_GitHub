config_version = 2

[bar.default]
capsule = true
capsule_opacity = 0.84999998100101948
capsule_padding = 8.0
capsule_radius = 10
capsule_thickness = 0.71999998763203621
center = [ "cpu", "temp", "ram", "control-center", "sysmon", "battery", "network_rx" ]
end = [ "tray", "clipboard", "bluetooth", "network", "brightness", "volume", "input_volume", "session" ]
font_family = "IBM Plex Sans"
margin_ends = 0
padding = 2
radius = 0
radius_bottom_left = 8
radius_bottom_right = 8
scale = 0.90000000596046448
shadow = false
start = [ "launcher", "privacy", "clock", "weather", "notifications", "caffeine", "group:g1", "workspaces" ]
thickness = 42

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "media", "audio_visualizer" ]
    opacity = 0.84999996423721313
    padding = 8.0
    radius = 10.0

[battery]
warning_threshold = 25

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "whitby, canada"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 601.0
    output = "WL-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1024.0
    cy = 1161.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
temperature_night = 5000

[notification]
position = "top_left"

[plugins]
enabled = []

[shell]
avatar_path = "/run/current-system/sw/share/pixmaps/faces/gamepad.jpg"
external_ip_enabled = true
font_family = "IBM Plex Sans Text"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    session_search = true

[theme]
builtin = "Ayu"
community_palette = "Flexoki"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "mango", "qt" ]
    community_ids = [ "steam" ]

[wallpaper]
directory = "/home/echoes/Pictures"
fill_color = "shadow"
fill_mode = "fit"
transition = [ "disc", "fade", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
