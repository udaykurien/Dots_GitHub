config_version = 2

[bar.default]
capsule = true
capsule_opacity = 0.84999998100101948
capsule_padding = 8.0
capsule_radius = 8
capsule_thickness = 0.64999998919665813
center = [ "cpu", "temp", "ram", "control-center", "sysmon", "battery", "network_rx" ]
end = [
    "tray",
    "notes",
    "clipboard",
    "caffeine",
    "notifications",
    "brightness",
    "volume",
    "input_volume",
    "bluetooth",
    "network",
    "session"
]
font_family = "IBM Plex Sans"
margin_ends = 0
padding = 2
radius = 0
radius_bottom_left = 8
radius_bottom_right = 8
shadow = false
start = [ "launcher", "privacy", "clock", "weather", "audio_visualizer", "workspaces" ]
thickness = 42
widget_spacing = 2

[battery]
warning_threshold = 25

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "whitby, canada"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 601.0
    output = "WL-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1024.0
    cy = 1161.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
temperature_night = 5000

[notification]
background_opacity = 0.89999997988343239

[osd]
background_opacity = 0.89999997988343239

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/notes", "noctalia/example", "noctalia/timer" ]

[shell]
external_ip_enabled = true
font_family = "IBM Plex Sans Text"
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    session_search = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Ayu"
community_palette = "Cream"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "steam" ]

[wallpaper]
directory = "/home/echoes/Pictures"
transition = [ "disc", "fade", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/echoes/Pictures/persona5-n11amg4bebrd1.jpeg"

    [wallpaper.last]
    path = "/home/echoes/Pictures/persona5-n11amg4bebrd1.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/echoes/Pictures/persona5-n11amg4bebrd1.jpeg"

[widget.active_window]
max_length = 115
min_length = 115
show_empty_label = true
title_scroll = "always"

[widget.audio_visualizer]
color_1 = "on_surface"
color_2 = "on_surface"
show_when_idle = true

[widget.brightness]
scroll_step = 1
show_label = false

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%H:%M  •  %a, %d }"

[widget.control-center]
anchor = true
glyph = "cat"

[widget.cpu]
display = "text"

[widget.input_volume]
color = "error"
mute_color = "on_surface"
scroll_step = 1
show_label = false

[widget.media]
hide_when_no_media = true
max_length = 140
title_scroll = "always"

[widget.network]
show_label = false

[widget.network_rx]
display = "text"

[widget.notes]
type = "noctalia/notes:notes"

[widget.privacy]
active_color = "error"
hide_inactive = true
icon_spacing = 8

[widget.ram]
display = "text"

[widget.sysmon]
display = "text"
stat = "disk_pct"

[widget.temp]
display = "text"
glyph = "temperature"

[widget.tray]
drawer_columns = 5
match_adjacent_spacing = true

[widget.volume]
scroll_step = 1
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.7000000000000002
focused_output_only = true
hide_when_empty = true
max_label_chars = 5
scale = 1.1000000000000001