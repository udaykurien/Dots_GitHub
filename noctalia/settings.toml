    theme_mode = "auto"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    path = "/home/echoes/Pictures/neon-genesis-evangellion-value-invert-colorized-cyan-purple-wallhaven-8g9wyy.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
