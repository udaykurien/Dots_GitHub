[widget.active_window]
max_length = 115
min_length = 115
show_empty_label = true
title_scroll = "always"

[widget.audio_visualizer]
bands = 12
color_1 = "on_surface"
color_2 = "on_surface"
show_when_idle = true

[widget.bar]
type = "noctalia/timer:bar"

[widget.brightness]
show_label = false

    [widget.brightness.actions]
    scroll_down = "brightness-down 1%"
    scroll_up = "brightness-up 1%"

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cat_2]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%H:%M  •  %a, %d }"

[widget.control-center]
anchor = true
color = "primary"
glyph = "navigation-filled"

[widget.cpu]
display = "text"

[widget.disk]
display = "text"

[widget.input_volume]
color = "error"
mute_color = "on_surface"
scroll_step = 1
show_label = false

[widget.launcher]
enabled = false

[widget.media]
album_art_only = true
art_size = 18
max_length = 140
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.network_rx]
display = "text"

[widget.network_tx]
display = "text"

[widget.notes]
type = "noctalia/notes:notes"

[widget.privacy]
active_color = "error"
hide_inactive = true
icon_spacing = 8

[widget.ram]
display = "text"
stat = "ram_pct"

[widget.session]
enabled = false

[widget.swap]
display = "text"

[widget.sysmon]
display = "text"
stat = "disk_used_pct"

[widget.taskbar]
only_active_workspace = true
workspace_group_capsule = false

[widget.temp]
display = "text"
glyph = "temperature"

[widget.tray]
drawer_columns = 5
match_adjacent_spacing = true

[widget.volume]
show_label = false

    [widget.volume.actions]
    scroll_down = "volume-down 1%"
    scroll_up = "volume-up 1%"

[widget.weather]
show_condition = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
focused_output_only = true
style = "minimal"