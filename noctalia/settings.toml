[widget.active_window]
max_length = 115
min_length = 115
show_empty_label = true
title_scroll = "always"

[widget.audio_visualizer]
bands = 14
color_1 = "on_surface"
color_2 = "on_surface"
show_when_idle = true

[widget.brightness]
scroll_step = 1

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%H:%M  •  %a, %d }"

[widget.control-center]
anchor = true
color = "primary"
glyph = "navigation-filled"

[widget.cpu]
display = "text"

[widget.input_volume]
color = "error"
mute_color = "on_surface"
scroll_step = 1

[widget.media]
album_art_only = true
art_size = 18
max_length = 140
title_scroll = "always"

[widget.network_rx]
display = "text"

[widget.privacy]
active_color = "error"
hide_inactive = true
icon_spacing = 8

[widget.ram]
display = "text"

[widget.sysmon]
display = "text"
stat = "disk_pct"

[widget.temp]
display = "text"
glyph = "temperature"

[widget.tray]
drawer_columns = 5
match_adjacent_spacing = true

[widget.volume]
scroll_step = 1

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.7000000000000002
focused_output_only = true
hide_when_empty = true
max_label_chars = 5
scale = 1.1000000000000001